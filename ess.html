<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ESS Self Assessment · Eiger Jateng 01</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#0F3192;--navy-ink:#0B1B4A;--orange:#E46636;--ink:#16213D;--mut:#5A6482;--bg:#F3F5FA;--line:#E1E6F0;--ok:#13806F;--bad:#C0392B;--f:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color-scheme:light only}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--f);min-height:100vh}
.hero{position:relative;overflow:hidden;background:linear-gradient(160deg,#0B1B4A 0%,#0F3192 55%,#1B47C2 100%);color:#fff;padding:calc(22px + env(safe-area-inset-top,0px)) 18px 74px}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;pointer-events:none}
.hero::before{width:340px;height:340px;right:-90px;top:-130px;background:radial-gradient(circle,rgba(228,102,54,.55),rgba(228,102,54,0) 68%)}
.hero::after{width:300px;height:300px;left:-110px;bottom:-170px;background:radial-gradient(circle,rgba(120,160,255,.35),rgba(120,160,255,0) 70%)}
.wrap{max-width:860px;margin:0 auto;position:relative;z-index:1}
.brand{display:flex;align-items:center;gap:12px}.logo{background:#fff;border-radius:10px;padding:6px 10px;display:flex}.logo img{height:26px}
.brand small{opacity:.85;font-weight:600;letter-spacing:.3px}
h1{margin:18px 0 4px;font-size:clamp(24px,5vw,34px);font-weight:800;letter-spacing:-.3px;line-height:1.15}h1 em{font-style:normal;color:#FFB28F}
.sub{opacity:.88;max-width:560px;margin:0}.bar{width:64px;height:5px;border-radius:5px;background:var(--orange);margin:16px 0 18px}
.steps{display:flex;gap:8px;flex-wrap:wrap}.st{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:6px 14px 6px 7px;font-size:12.5px;font-weight:700;opacity:.65}
.st i{font-style:normal;display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.2);font-size:12px}
.st.on{opacity:1;background:#fff;color:var(--navy)}.st.on i{background:var(--orange);color:#fff}.st.ok{opacity:1}.st.ok i{background:var(--ok);color:#fff}
main{max-width:860px;margin:-46px auto 0;padding:0 14px 40px;position:relative;z-index:2}
.card{background:#fff;border-radius:18px;box-shadow:0 18px 50px rgba(11,27,74,.16);border-top:5px solid var(--orange);overflow:hidden;margin-bottom:16px}.pad{padding:24px 22px}
h2{margin:0 0 6px;font-size:21px;font-weight:800;color:var(--navy)}.mut{color:var(--mut);font-size:13.5px}
label{display:block;font-weight:700;font-size:13px;margin:16px 0 6px}.lb{display:flex;align-items:center;gap:8px}.lb b{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--navy);color:#fff;font-size:12px}
select,input[type=text]{width:100%;padding:13px 14px;border:1.5px solid #CBD5E1;border-radius:12px;font:inherit;background:#fff;color:var(--ink);transition:border-color .15s,box-shadow .15s}
select:focus,input[type=text]:focus{outline:0;border-color:var(--navy);box-shadow:0 0 0 4px rgba(15,49,146,.12)}
.btn{border:0;background:linear-gradient(135deg,#0F3192,#1B47C2);color:#fff;border-radius:12px;padding:14px 26px;font:inherit;font-weight:800;cursor:pointer;box-shadow:0 8px 20px rgba(15,49,146,.28);transition:transform .12s}
.btn:hover:not(:disabled){transform:translateY(-1px)}.btn:disabled{background:#CBD5E1;box-shadow:none;cursor:not-allowed}.btn.sec{background:#EEF2FB;color:var(--navy);box-shadow:none}.btn.or{background:linear-gradient(135deg,#E46636,#C9531F);box-shadow:0 8px 20px rgba(228,102,54,.3)}
.err{background:#FDECEB;color:#9B2C20;border-radius:12px;padding:11px 14px;margin-top:14px;font-size:14px;font-weight:600}.info{background:#EEF2FB;color:var(--navy);border-radius:12px;padding:11px 14px;font-size:13.5px;margin-top:14px}
.rule{display:flex;gap:12px;align-items:flex-start;background:#FDF0EA;border-radius:12px;padding:12px 14px;margin-top:14px;font-size:13.5px}.rule span{font-size:20px}
.head{background:linear-gradient(180deg,#F6F8FC,#fff);border-bottom:1px solid var(--line);padding:20px 22px}.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.badge{background:linear-gradient(135deg,#4F46E5,#6D5BF0);color:#fff;border-radius:999px;padding:5px 14px;font-size:12px;font-weight:800;letter-spacing:.4px}
.q{margin:12px 0 6px;padding:12px 14px;border-left:5px solid var(--orange);background:#FDF0EA;border-radius:0 12px 12px 0;font-size:17px;font-weight:800;color:var(--navy-ink)}
.pt{padding:16px 22px;border-top:1px solid #EEF1F7}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.no{display:grid;place-items:center;min-width:40px;height:40px;border-radius:12px;background:#EEF2FB;color:var(--navy);font-weight:800;font-size:14px}
.tx{flex:1 1 260px;font-weight:600}.sw{display:flex;gap:8px}
.ab{border:1.5px solid #D5DBE8;background:#F6F8FC;color:var(--mut);border-radius:999px;padding:9px 18px;font:inherit;font-weight:800;cursor:pointer;transition:all .15s}
.ab.p.on{background:#DCFCE7;border-color:#4ADE80;color:#166534;box-shadow:0 4px 12px rgba(22,101,52,.18)}.ab.k.on{background:#FEE2E2;border-color:#F87171;color:#B91C1C;box-shadow:0 4px 12px rgba(185,28,28,.18)}
.note{margin-top:10px;padding-left:52px}.note input{padding:10px 12px;font-size:14px}
.foot{position:sticky;bottom:0;display:flex;justify-content:space-between;align-items:center;gap:14px;padding:14px 22px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:rgba(255,255,255,.96);backdrop-filter:blur(8px);flex-wrap:wrap}
.tm{display:flex;align-items:center;gap:14px}.ring{position:relative;width:64px;height:64px;flex:none}.ring svg{transform:rotate(-90deg)}.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:14px;font-weight:800;color:var(--navy)}
.tm .why{font-size:12.5px;color:var(--mut);max-width:300px}.tm .ttl{font-weight:800}
.center{text-align:center;padding:42px 22px}.big{font-size:56px;line-height:1;margin-bottom:8px;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
.foo{text-align:center;color:var(--mut);font-size:12px;margin-top:6px}
@media(max-width:560px){.note{padding-left:0}.pad{padding:20px 16px}.pt,.head{padding-left:16px;padding-right:16px}.sw{width:100%}.ab{flex:1}}
</style></head><body>

  <h1>ESS <em>Self Assessment</em></h1><p class="sub">Reminder briefing siang untuk tim toko. Bahas journey satu per satu bersama timmu, lalu jawab dengan jujur: Paham atau Kendala.</p>

<div class="foo">Eigerindo MPI · Integrated Hub Jateng 01</div>
<script src="ess-data.js"></script>
<script>
const API = "https://script.google.com/macros/s/AKfycbwJAbY6vgj6TW9fbUCkvZTF1_QwTLWt1S3BnnF7_AWoxhclR07cJOtkPMrUGrPePsbZbg/exec";
const $ = s => document.querySelector(s), esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
async function call(url, init) {
  let r; try { r = await fetch(url, init); } catch (e) { throw new Error('Tidak bisa terhubung. Cek internet lalu coba lagi.'); }
  const j = await r.json().catch(() => ({ error: 'x', message: 'Jawaban server tidak terbaca.' }));
  if (j && j.error === 'auth') throw new Error('Layanan ESS belum aktif di server. Hubungi admin (Code.gs versi terbaru perlu di-deploy).');
  if (j && j.error) throw new Error(j.message || j.error); return j;
}
const get = a => call(API + '?a=' + a, { redirect: 'follow' });
const post = b => call(API, { method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(b) });
const S = { step: 'load', stores: [], code: '', nik: '', name: '', sid: '', i: 0, ans: {}, left: ESS_J.map(() => ESS_SEC), err: '', busy: false, timer: null };
async function init() { try { S.stores = (await get('essPubStores')).stores || []; } catch (e) { S.err = e.message; } S.step = 'id'; draw(); }
function okJ(j) { return j.pts.every(p => { const a = S.ans[p[0]]; return a && (a.v === 'P' || (a.v === 'K' && (a.n || '').trim().length >= 5)); }); }
function steps() {
  const cur = S.step === 'slide' ? S.i + 1 : S.step === 'done' ? 99 : 0, names = ['Identitas', ...ESS_J.map(j => 'Journey ' + j.id)];
  $('#steps').innerHTML = names.map((n, k) => `<div class="st ${k < cur ? 'ok' : k === cur ? 'on' : ''}"><i>${k < cur ? '✓' : k + 1}</i>${n}</div>`).join('');
}
const C = 2 * Math.PI * 28;
function paint() {
  const j = ESS_J[S.i]; if (S.step !== 'slide' || !j) return; const l = S.left[S.i], ok = okJ(j), b = $('#nx'); if (!b) return;
  $('#ring').style.strokeDashoffset = C * (1 - (ESS_SEC - l) / ESS_SEC); $('#mm').textContent = l > 0 ? String(Math.floor(l / 60)).padStart(2, '0') + ':' + String(l % 60).padStart(2, '0') : '✓';
  $('#ttl').textContent = l > 0 ? 'Baca & diskusikan dulu' : 'Waktu baca terpenuhi';
  $('#why').textContent = l > 0 ? 'Tombol lanjut aktif setelah timer selesai. Timer berhenti kalau halaman ditinggal.' : !ok ? 'Isi semua poin. Jika memilih Kendala, catatan wajib diisi (min. 5 huruf).' : 'Siap dilanjutkan 👍';
  b.disabled = S.busy || !(l === 0 && ok);
}
function tick() { if (S.step !== 'slide') { clearInterval(S.timer); S.timer = null; return; } if (document.visibilityState !== 'visible') return; if (S.left[S.i] > 0) S.left[S.i]--; paint(); }
function draw() {
  steps(); const A = $('#app'), e = S.err ? `<div class="err">⚠ ${esc(S.err)}</div>` : '';
  if (S.step === 'load') { A.innerHTML = '<div class="card pad"><p class="mut">Memuat…</p></div>'; return; }
  if (S.step === 'id') {
    A.innerHTML = `<div class="card pad"><h2>Mulai Self Assessment</h2><p class="mut" style="margin:0">Ada ${ESS_J.length} slide journey. Tiap slide minimal <b>${ESS_SEC / 60} menit</b> supaya benar-benar dibaca & didiskusikan.</p>
      <div class="rule"><span>⏱</span><div>Tombol lanjut baru aktif setelah waktu habis dan semua poin terisi. Jawab sesuai kondisi sebenarnya, tidak ada nilai benar atau salah.</div></div>
      <label class="lb"><b>1</b>Pilih toko</label><select id="st"><option value="">— pilih toko —</option>${S.stores.map(r => `<option value="${esc(r[0])}" ${r[0] === S.code ? 'selected' : ''}>${esc(r[1])} (${esc(r[0])})</option>`).join('')}</select>
      <label class="lb"><b>2</b>Masukkan NIK</label><input type="text" id="nk" autocomplete="off" autocapitalize="characters" placeholder="NIK karyawan" value="${esc(S.nik)}">
      ${!S.stores.length && !S.err ? '<div class="info">Belum ada toko yang daftar RA-nya terisi. Minta Store Head mengisi daftar RA dulu.</div>' : ''}${e}
      <div style="margin-top:20px"><button class="btn" id="go" ${S.busy ? 'disabled' : ''}>${S.busy ? 'Memeriksa…' : 'Lanjut ▶'}</button></div></div>`; return;
  }
  if (S.step === 'confirm') { A.innerHTML = `<div class="card center"><div class="big">👋</div><h2>Halo, ${esc(S.name)}!</h2><p class="mut">Toko ${esc((S.stores.find(r => r[0] === S.code) || [])[1] || S.code)}. Benar ini kamu?</p>${e}<div style="margin-top:18px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap"><button class="btn or" id="yes">Ya, mulai ▶</button><button class="btn sec" id="no">Bukan, ganti</button></div></div>`; return; }
  if (S.step === 'done') { A.innerHTML = `<div class="card center"><div class="big">🎉</div><h2>Terima kasih, ${esc(S.name)}!</h2><p class="mut">Self assessment kamu sudah terkirim. Kendala yang kamu tulis akan ditindaklanjuti Store Head.</p><button class="btn sec" id="again" style="margin-top:14px">Isi untuk RA lain</button></div>`; return; }
  const j = ESS_J[S.i], last = S.i === ESS_J.length - 1;
  A.innerHTML = `<div class="card"><div class="head"><div class="top"><span class="badge">JOURNEY ${j.id}</span><b>${esc(j.tp)}</b><span class="mut" style="margin-left:auto">${j.pts.length} Poin Standar · Slide ${S.i + 1}/${ESS_J.length}</span></div>
    <div class="q">❝ ${esc(j.q)}</div><div class="mut"><i>Bahas poin satu per satu bersama tim. <b>Paham</b> = sudah mengerti & biasa menerapkan. <b>Kendala</b> = belum paham / sulit dijalankan (tulis kendalanya).</i></div></div>
    ${j.pts.map((p, k) => { const a = S.ans[p[0]] || {}; return `<div class="pt"><div class="row"><span class="no">${String(k + 1).padStart(2, '0')}</span><span class="tx">${esc(p[1])}</span>
      <div class="sw"><button class="ab p ${a.v === 'P' ? 'on' : ''}" data-a="${p[0]}:P">✔ Paham</button><button class="ab k ${a.v === 'K' ? 'on' : ''}" data-a="${p[0]}:K">⚠ Kendala</button></div></div>
      <div class="note"><input type="text" data-n="${p[0]}" value="${esc(a.n || '')}" placeholder="${a.v === 'K' ? 'Wajib: apa yang belum paham / jadi kendala…' : 'Catatan (opsional): contoh penerapan / pertanyaan…'}"></div></div>`; }).join('')}
    <div class="foot"><div class="tm"><div class="ring"><svg width="64" height="64"><circle cx="32" cy="32" r="28" fill="none" stroke="#E5EAF3" stroke-width="6"/><circle id="ring" cx="32" cy="32" r="28" fill="none" stroke="#E46636" stroke-width="6" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C}" style="transition:stroke-dashoffset 1s linear"/></svg><b id="mm"></b></div><div><div class="ttl" id="ttl"></div><div class="why" id="why"></div>${e}</div></div>
      <button class="btn or" id="nx" disabled>${last ? 'Kirim Self Assessment ✔' : 'Lanjut ke Journey ' + ESS_J[S.i + 1].id + ' →'}</button></div></div>`;
  paint(); if (!S.timer) S.timer = setInterval(tick, 1000);
}
document.addEventListener('input', e => { const n = e.target.dataset && e.target.dataset.n; if (n) { (S.ans[n] = S.ans[n] || {}).n = e.target.value; paint(); } if (e.target.id === 'nk') S.nik = e.target.value; });
document.addEventListener('change', e => { if (e.target.id === 'st') S.code = e.target.value; });
document.addEventListener('click', async e => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.dataset.a) { const [no, v] = t.dataset.a.split(':'); (S.ans[no] = S.ans[no] || {}).v = v; const y = scrollY; draw(); scrollTo(0, y); return; }
  try {
    if (t.id === 'go') { S.err = ''; S.nik = $('#nk').value.trim(); S.code = $('#st').value; if (!S.code || !S.nik) { S.err = 'Pilih toko dan isi NIK dulu.'; draw(); return; } S.busy = true; draw();
      try { const r = await post({ a: 'essPub', op: 'start', code: S.code, nik: S.nik }); S.sid = r.sid; S.name = r.name; S.step = 'confirm'; } catch (er) { S.err = er.message; } S.busy = false; draw(); }
    else if (t.id === 'no') { S.step = 'id'; S.err = ''; S.sid = ''; draw(); }
    else if (t.id === 'yes') { S.step = 'slide'; S.i = 0; S.ans = {}; S.left = ESS_J.map(() => ESS_SEC); S.err = ''; draw(); scrollTo(0, 0); }
    else if (t.id === 'again') { S.step = 'id'; S.nik = ''; S.err = ''; S.sid = ''; draw(); }
    else if (t.id === 'nx') {
      if (S.i < ESS_J.length - 1) { S.i++; S.err = ''; draw(); scrollTo(0, 0); return; }
      const ans = ESS_J.flatMap(j => j.pts.map(p => [p[0], S.ans[p[0]].v, (S.ans[p[0]].n || '').trim()])); S.busy = true; S.err = ''; paint();
      try { await post({ a: 'essPub', op: 'submit', sid: S.sid, slides: ESS_J.length, answers: ans }); S.step = 'done'; } catch (er) { S.err = er.message; } S.busy = false; draw(); scrollTo(0, 0);
    }
  } catch (er) { S.err = er.message; S.busy = false; draw(); }
});
init();
</script></body></html>
